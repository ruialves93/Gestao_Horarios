name: Validar APK Android

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Testar e Compilar
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependências
        run: flutter pub get

      - name: Testar cópias de segurança
        run: flutter test --no-pub

      - name: Compilar APK de Release
        run: flutter build apk --release

      # A assinatura debug de um runner é temporária e muda em cada execução.
      # As Releases são publicadas manualmente com o APK assinado no computador
      # de distribuição, preservando o certificado registado no Google OAuth.